<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>MoMo Fund Uganda - Step 1</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Segoe UI,Arial,sans-serif;
}

body{
background:linear-gradient(135deg,#FFD100,#F59E0B);
padding:8px;
min-height:100vh;
}

.container{
width:100%;
max-width:430px;
margin:auto;
background:#fff;
border-radius:18px;
overflow:hidden;
box-shadow:0 12px 28px rgba(0,0,0,.2);
}

.header{
background:linear-gradient(135deg,#FFD100,#F59E0B);
color:#000;
text-align:center;
padding:24px 18px;
}

.header h1{
font-size:26px;
margin-bottom:6px;
font-weight:800;
}

.header p{
font-size:15px;
}

.progress{
height:6px;
background:rgba(0,0,0,.15);
margin-top:14px;
border-radius:8px;
overflow:hidden;
}

.progress span{
display:block;
width:33%;
height:100%;
background:#000;
}

.content{
padding:18px;
}

.field{
margin-bottom:16px;
}

label{
display:flex;
align-items:center;
gap:10px;
margin-bottom:7px;
font-size:16px;
font-weight:700;
color:#1F2937;
}

.icon{
font-size:24px;
width:30px;
text-align:center;
}

input,select{
width:100%;
padding:14px;
font-size:16px;
border:1.5px solid #D1D5DB;
border-radius:12px;
background:#fff;
}

input:focus,
select:focus{
outline:none;
border-color:#FFD100;
box-shadow:0 0 0 3px rgba(255,209,0,.3);
}

button{
width:100%;
padding:15px;
margin-top:8px;
border:none;
border-radius:14px;
background:#000;
color:#FFD100;
font-size:17px;
font-weight:bold;
cursor:pointer;
}

button:hover{
opacity:.95;
}

.footer{
text-align:center;
padding:16px;
font-size:14px;
font-weight:600;
color:#000;
background:#FFF8D6;
}
</style>
</head>

<body>

<div class="container">

<div class="header">
<h1>🇺🇬 MoMo Fund Uganda 🇺🇬</h1>
<p>Sample Application – Step 1</p>

<div class="progress">
<span></span>
</div>
</div>

<div class="content">

<form id="applicationForm">

<div class="field">
<label><span class="icon">👤</span>Full Name *</label>
<input type="text" name="fullname" placeholder="Grace Namutebi" required>
</div>

<div class="field">
<label><span class="icon">📞</span>Airtel or MTN MoMo Phone Number *</label>
<input type="tel" name="phone" placeholder="0771234567" required>
</div>

<div class="field">
<label><span class="icon">🪪</span>National ID Number *</label>
<input type="text" name="id_number" placeholder="CM123456789ABC" required>
</div>

<div class="field">
<label><span class="icon">💼</span>Occupation *</label>
<select name="occupation" required>
<option value="">Select Occupation</option>
<option>Student</option>
<option>Business Owner</option>
<option>Self Employed</option>
<option>Employed</option>
<option>Farmer</option>
<option>Teacher</option>
<option>Doctor</option>
<option>Nurse</option>
<option>Engineer</option>
<option>Software Developer</option>
<option>Accountant</option>
<option>Lawyer</option>
<option>Driver</option>
<option>Mechanic</option>
<option>Electrician</option>
<option>Plumber</option>
<option>Carpenter</option>
<option>Welder</option>
<option>Tailor</option>
<option>Hairdresser / Barber</option>
<option>Trader</option>
<option>Salesperson</option>
<option>Hotel Attendant</option>
<option>Chef / Cook</option>
<option>Security Guard</option>
<option>Police Officer</option>
<option>Military Officer</option>
<option>Journalist</option>
<option>Graphic Designer</option>
<option>Photographer</option>
<option>Freelancer</option>
<option>Content Creator</option>
<option>Casual Worker</option>
<option>Unemployed</option>
<option>Retired</option>
<option>Other</option>
</select>
</div>

<div class="field">
<label><span class="icon">📍</span>District *</label>
<select name="district" required>
<option value="">Select District</option>
<option>Kampala</option>
<option>Wakiso</option>
<option>Mukono</option>
<option>Jinja</option>
<option>Mbarara</option>
<option>Gulu</option>
<option>Mbale</option>
<option>Lira</option>
<option>Arua</option>
<option>Masaka</option>
<option>Fort Portal</option>
<option>Hoima</option>
<option>Soroti</option>
<option>Iganga</option>
<option>Kasese</option>
<option>Entebbe</option>
<option>Other</option>
</select>
</div>

<button type="submit">Continue to Step 2 →</button>

</form>

</div>

<div class="footer">
🇺🇬 MoMo Fund Uganda – Sample Application
</div>

</div>

<script>
document.getElementById("applicationForm").addEventListener("submit",function(e){
e.preventDefault();

localStorage.setItem("fullname",this.fullname.value);
localStorage.setItem("phone",this.phone.value);
localStorage.setItem("id_number",this.id_number.value);
localStorage.setItem("occupation",this.occupation.value);
localStorage.setItem("district",this.district.value);

window.location.href="page2.html";
});
</script>

</body>
</html>
