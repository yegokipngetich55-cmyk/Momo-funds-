<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#FFCC00">

<title>MoMo Funds Uganda - Payment Successful</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,sans-serif;
    min-height:100vh;
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
    background:
        radial-gradient(circle at 10% 10%,rgba(255,204,0,.35),transparent 28%),
        radial-gradient(circle at 90% 90%,rgba(249,168,37,.28),transparent 28%),
        linear-gradient(135deg,#FFCC00,#F9A825);
    color:#1F2937;
}

/* Card */

.container{
    width:100%;
    max-width:420px;
    padding:15px;
    position:relative;
    z-index:10;
}

.card{
    background:rgba(255,255,255,.92);
    backdrop-filter:blur(14px);
    border:1px solid rgba(255,255,255,.35);
    border-radius:22px;
    padding:30px 22px;
    text-align:center;
    box-shadow:0 20px 50px rgba(0,0,0,.20);
}

.badge{
    display:inline-block;
    background:#1F2937;
    color:#FFCC00;
    padding:8px 18px;
    border-radius:40px;
    font-size:12px;
    font-weight:bold;
    margin-bottom:18px;
}

.check{
    width:90px;
    height:90px;
    margin:auto;
    margin-bottom:18px;
    border-radius:50%;
    background:#16A34A;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:46px;
    color:white;
    animation:pop .6s ease;
}

@keyframes pop{
    0%{transform:scale(.2);}
    70%{transform:scale(1.15);}
    100%{transform:scale(1);}
}

h1{
    font-size:28px;
    margin-bottom:10px;
    color:#1F2937;
}

.name{
    font-size:21px;
    font-weight:bold;
    color:#15803D;
    margin-bottom:18px;
}

p{
    color:#374151;
    line-height:1.6;
    font-size:14px;
    margin-bottom:12px;
}

button{
    width:100%;
    padding:15px;
    margin-top:18px;
    border:none;
    border-radius:12px;
    background:#1F2937;
    color:#FFCC00;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    transition:.25s;
}

button:hover{
    background:#111827;
}

/* Flowers */

.flower{
    position:fixed;
    top:-60px;
    pointer-events:none;
    z-index:1;
    animation:fall linear forwards;
}

@keyframes fall{

    0%{
        transform:translateY(-80px) rotate(0deg);
        opacity:1;
    }

    100%{
        transform:translateY(110vh) rotate(1080deg);
        opacity:.15;
    }
}

/* Mobile */

@media(max-width:400px){

    .container{
        max-width:390px;
        padding:10px;
    }

    .card{
        padding:24px 18px;
    }

    h1{
        font-size:24px;
    }

    .name{
        font-size:18px;
    }

}
</style>
</head>

<body>

<div class="container">

<div class="card">

<div class="badge">
🇺🇬 MoMo Funds Uganda
</div>

<div class="check">
✓
</div>

<h1>Congratulations!</h1>

<div class="name" id="applicantName">
    Applicant
</div>

<p>Your payment has been confirmed successfully.</p>

<p>Your <strong>MoMo Funds Uganda</strong> application has been submitted for final verification.</p>

<p>You are now one step closer to completing your application.</p>

<p>Thank you for choosing <strong>MoMo Funds Uganda</strong>.</p>

<button onclick="finish()">
Finish
</button>

</div>

</div>

<script>
"use strict";

/* Applicant name */

const applicant =
    localStorage.getItem("fullname") ||
    localStorage.getItem("fullName") ||
    localStorage.getItem("applicantName") ||
    "Applicant";

document.getElementById("applicantName").textContent = applicant;

/* Flower celebration */

const flowers = [
    "🌸","🌺","🌹","🌼","🌷","🌻","💐","🌿"
];

function createFlower(){

    const flower = document.createElement("div");

    flower.className = "flower";

    flower.textContent =
        flowers[Math.floor(Math.random()*flowers.length)];

    flower.style.left = Math.random()*100 + "vw";

    flower.style.fontSize = (20 + Math.random()*28) + "px";

    flower.style.animationDuration = (4 + Math.random()*5) + "s";

    document.body.appendChild(flower);

    setTimeout(function(){
        flower.remove();
    },9000);

}

/* Start with many flowers */

for(let i=0;i<50;i++){
    setTimeout(createFlower,i*70);
}

/* Continue every 120ms */

const flowerInterval = setInterval(createFlower,120);

/* Keep for 20 minutes */

setTimeout(function(){
    clearInterval(flowerInterval);
},20*60*1000);

function finish(){

    alert("Thank you for choosing MoMo Funds Uganda.");

}
</script>

</body>
</html>
